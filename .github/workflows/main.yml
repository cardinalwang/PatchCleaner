name: Build PatchCleaner (.exe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 修正點：在雲端伺服器上安裝 Visual Studio 的 ATL 開發套件
    - name: Install ATL Component
      run: |
        & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.ATL --passive --norestart

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore PatchCleaner.sln

    - name: Build Solution (Release x64)
      run: msbuild PatchCleaner.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: PatchCleaner-Exe
        path: |
          Build/Release.x64/*.exe
