.name: Build PatchCleaner (.exe)

on:
  workflow_dispatch:

jobs:
  build:
    # 關鍵修正：切換回原生完美支援此專案的環境，自帶 ATL/WTL 與 v142 工具集
    runs-on: windows-2019

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore PatchCleaner.sln

    - name: Build Solution (Release x64)
      run: msbuild PatchCleaner.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: PatchCleaner-Exe
        path: |
          Build/Release.x64/*.exe
