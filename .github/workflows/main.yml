name: Build PatchCleaner (.exe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore PatchCleaner.sln

    # 關鍵修正：在編譯前，用修補指令直接將專案檔內所有的「警告視為錯誤」強制關閉
    - name: Disable Treat Warnings As Errors in vcxproj
      shell: powershell
      run: |
        $path = "patch_cleaner\PatchCleaner.vcxproj"
        (Get-Content $path) -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>' | Set-Content $path

    # 開始編譯（移除多餘的外部引數，交由上方實體修改後的專案檔處理）
    - name: Build Solution (Release x64)
      run: |
        msbuild PatchCleaner.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: PatchCleaner-Exe
        path: |
          Build/Release.x64/*.exe
