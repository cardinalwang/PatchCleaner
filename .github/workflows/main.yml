name: Build PatchCleaner (.exe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore PatchCleaner.sln

    # 最終修正點：加入 /p:TreatWarningsAsErrors=false 忽略代碼中的警告阻礙
    - name: Build Solution (Release x64)
      run: |
        msbuild PatchCleaner.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=false

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: PatchCleaner-Exe
        path: |
          Build/Release.x64/*.exe
