name: Build PatchCleaner (.exe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # 使用官方現行的 Windows 2022 伺服器

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # 自動還原專案所需的 WTL 等 NuGet 套件
    - name: Restore NuGet Packages
      run: nuget restore PatchCleaner.sln

    # 關鍵修正：直接強制專案使用伺服器內建且完整的 v143 (VS2022) 工具集與最新 SDK
    - name: Build Solution (Release x64)
      run: |
        msbuild PatchCleaner.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: PatchCleaner-Exe
        path: |
          Build/Release.x64/*.exe
